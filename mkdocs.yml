site_name: PyTAQ Documentation
site_description: Python module for processing NYSE TAQ (Trade and Quote) data using Ibis
site_author: Vincent Grégoire
repo_url: https://github.com/fintech-research/pytaq
repo_name: fintech-research/pytaq

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            filters:
              - "!^_"  # Exclude private members

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - User Guide:
      - Data Cleaning: user-guide/cleaning.md
      - Computing Metrics: user-guide/metrics.md
      - Working with NBBO: user-guide/nbbo.md
  - API Reference:
      - Data Sources: api/data-sources.md
      - Cleaning Module: api/cleaning.md
      - Metrics Module: api/metrics.md
      - Utils Module: api/utils.md
  - Contributing:
      - Development Setup: contributing/development.md
      - Testing: contributing/testing.md
      - Code Style: contributing/code-style.md
  - About:
      - Changelog: about/changelog.md
      - License: about/license.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fintech-research/pytaq
