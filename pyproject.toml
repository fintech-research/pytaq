[project]
name = "pytaq"
version = "0.2.0"
description = "Module to process NYSE TAQ data"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Vincent Grégoire", email = "vincent.gregoire@hec.ca" }]
dependencies = [
    "ibis-framework>=9.5.0",
    "ibis-framework[duckdb,polars,postgres]>=9.5.0",
]


[tool.uv.pip]
only-binary = ["pyarrow"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.21",
    "mkdocstrings>=0.30.1",
    "mkdocstrings-python>=1.18.2",
    "polars>=1.13.0",
    "pyarrow>=17",
    "pytest>=8.3.3",
    "pytest-cov>=7.0.0",
    "python-dotenv>=1.0.1",
]

[tool.ruff.format]
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
