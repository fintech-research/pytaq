[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytaq"
version = "0.3.0"
description = "Process NYSE TAQ trade and quote data with Ibis"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Vincent Grégoire", email = "vincent.gregoire@hec.ca" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "taq",
    "nyse",
    "market-microstructure",
    "finance",
    "ibis",
    "wrds",
    "trades",
    "quotes",
    "nbbo",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "ibis-framework>=12,<13",
    # ibis 12.0.0 imports packaging in its SQL compilers but never declares it,
    # so a minimal install of any SQL backend fails on import. Declare it here.
    "packaging>=21",
]

# Backends are optional: which one you need depends on how you use PyTAQ.
#   postgres -> querying the WRDS postgres server, on the WRDS cloud or locally
#   duckdb / polars -> working against local copies of TAQ files
[project.optional-dependencies]
duckdb = ["ibis-framework[duckdb]>=12,<13"]
polars = ["ibis-framework[polars]>=12,<13"]
# ibis[postgres] pulls bare psycopg, which needs a system libpq at import time.
# psycopg[binary] ships libpq in the wheel, so no system postgres is required.
postgres = ["ibis-framework[postgres]>=12,<13", "psycopg[binary]>=3.2"]
all = ["pytaq[duckdb,polars,postgres]"]

[project.urls]
Homepage = "https://github.com/fintech-research/pytaq"
Repository = "https://github.com/fintech-research/pytaq"
Documentation = "https://github.com/fintech-research/pytaq"
Issues = "https://github.com/fintech-research/pytaq/issues"

[tool.hatch.build.targets.wheel]
packages = ["pytaq"]
# PEP 561 marker, so downstream type checkers use our annotations.
artifacts = ["pytaq/py.typed"]

[tool.hatch.build.targets.sdist]
include = ["pytaq", "README.md", "LICENSE", "pyproject.toml"]


[dependency-groups]
dev = [
    # Developing and testing exercises every backend, so pull them all in.
    "ibis-framework[duckdb,polars,postgres]>=12,<13",
    "psycopg[binary]>=3.2",
    "mkdocs>=1.6.1",
    "pre-commit>=4.5.0",
    "mkdocs-material>=9.7.7",
    "mkdocstrings>=0.30.1",
    "mkdocstrings-python>=2.0.5",
    "pytest>=8.3.3",
    "pytest-cov>=7.0.0",
    # Reads local WRDS credentials from .env
    "python-dotenv>=1.2.2",
    "ruff>=0.16.1",
    "ty>=0.0.65",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "duckdb_only: needs a backend with window functions; polars has none",
]

[tool.coverage.run]
source = ["pytaq"]
# Branch coverage, not just line coverage. Most of the optional behaviour here
# is a flag guarding one statement, and line coverage counts the guarded line
# as covered without ever taking the other way through the branch.
branch = true
# Test files are 100% covered by construction. Counting them inflated the
# reported figure from 47% to 75% at one point, so they are excluded.
omit = ["*/test_*.py", "*/conftest.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
fail_under = 90
show_missing = true

[tool.ty.src]
exclude = [".venv", "site", "dist"]

# Almost everything here is an Ibis expression. Ibis builds its operators and
# column accessors dynamically, so ty (still 0.0.x) cannot follow the expression
# algebra: it reports `NumericValue <= float` as unsupported, and every function
# returning a derived expression as a return-type mismatch. Those rules produce
# only noise on this codebase.
#
# What ty is genuinely good at here is call signatures and imports, and that is
# what found real bugs: it independently flagged ibis.window(partition_by=) and
# the asof_join call filed as #7 and #9. Those stay on.
[tool.ty.rules]

[tool.ruff.format]
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E4",   # pycodestyle: imports
    "E7",   # pycodestyle: statements
    "E9",   # pycodestyle: runtime errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "N",    # pep8-naming
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific
]
